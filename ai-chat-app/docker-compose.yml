version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-chat-backend
    environment:
      - DATABASE_URL=sqlite:///./data/chat.db
      - API_BASE_URL=${API_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - API_KEY=${API_KEY:-}
      - AI_MODEL=${AI_MODEL:-glm-4-flash}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-chat-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
